# 이 저장소 폴더가 통째로 웹 루트로 마운트된다(docker-compose.yml 의 ./:/usr/share/nginx/html).
# 그 탓에 .git 이 그대로 받아져 커밋 이력·과거 소스를 복원할 수 있었다. 그 경로만 막는다.
#
# 나머지는 nginx:alpine 기본 default.conf 와 동일하게 둔다 — 인덱스 파일이 없어
# / 는 403, 없는 경로는 404 로 응답하는 기존 동작을 그대로 유지하기 위함이다.
server {
    listen       80;
    server_name  localhost;

    location ~ /\.git { return 404; }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
